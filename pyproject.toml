[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faultadapt-gym"
version = "0.1.0"
description = "CPU-first benchmark wrappers for adaptive robot control under hidden faults"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium[classic-control]>=1.0,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]
rl = ["stable-baselines3>=2.5,<3"]

[project.scripts]
faultadapt-smoke = "faultadapt_gym.smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
